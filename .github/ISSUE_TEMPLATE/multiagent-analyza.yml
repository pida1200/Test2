name: Multi-agent ANALÝZA
description: Výstup Analytika (vstup pro Kontrolora analytika)
title: "[ANALÝZA] "
labels: ["multiagent", "multiagent/analyza", "gate/pending"]
body:
  - type: input
    id: pipeline
    attributes:
      label: Pipeline issue
      description: "Jen číslo (#N); do body issue doplň samostatný řádek `Pipeline: #N` (anchored regex v CI)"
      placeholder: "#9"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Povinný řádek v body** (samostatně, mimo tabulky): `Pipeline: #<číslo z pole výše>`
  - type: input
    id: goal
    attributes:
      label: Cíl (1 věta)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / mimo scope
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: API nebo UI kontrakt
      description: request/response, stavy, chyby/HTTP
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Kritéria hotovo (3–5)
    validations:
      required: true
  - type: textarea
    id: edges
    attributes:
      label: Edge cases + rizika
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Návrh ověření
      placeholder: testy / lint / docker
    validations:
      required: true
  - type: textarea
    id: impl_steps
    attributes:
      label: Doporučené implementační kroky
      description: Pořadí = doporučená posloupnost commitů pro Vývojáře
      placeholder: |
        1. soubor X — popis
        2. soubor Y — popis
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verze artefaktu
      value: "v1"
