name: Multi-agent next step

# Při změně multiagent/* nebo gate/* labelu napíše do issue komentář s /m #N.

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write
  contents: read

jobs:
  comment-next:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      (
        github.event.action == 'opened' ||
        startsWith(github.event.label.name, 'multiagent/') ||
        startsWith(github.event.label.name, 'gate/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Compose next-step comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const artifact = labels.find(n => n.startsWith('multiagent/')) || 'multiagent/pipeline';
            const gate = labels.find(n => n.startsWith('gate/')) || 'gate/pending';
            const n = issue.number;

            // Parse pipeline # from body
            const body = issue.body || '';
            const pipelineMatch = body.match(/(?:Pipeline(?:\s+issue)?(?:\s+#)?:?\s*)#?(\d+)/i);
            const pipelineNum = pipelineMatch ? pipelineMatch[1] : (artifact === 'multiagent/pipeline' ? String(n) : null);

            const map = {
              'multiagent/pipeline': {
                'gate/pending': { role: 'Integrátor → Analytik', model: 'composer-2.5-fast', hint: 'Kickoff: vytvoř [ANALÝZA] nebo spusť Analytika' },
                'gate/blocked': { role: 'Eskalace', model: '—', hint: 'Vyřeš blokaci (≥3 reworky), sundat gate/blocked' },
              },
              'multiagent/analyza': {
                'gate/pending': { role: 'Analytik', model: 'claude-opus-5-thinking-high', hint: 'Doplň analýzu → Kontrolor A' },
                'gate/no-go': { role: 'Analytik (rework)', model: 'claude-opus-5-thinking-high', hint: 'Oprav dle VERDIKT-A' },
                'gate/go': { role: 'Kontrolor A / Vývojář', model: '—', hint: 'Analýza schválena — spusť Vývojáře po VERDIKT-A GO' },
              },
              'multiagent/verdikt': {
                'gate/pending': { role: 'Kontrolor', model: 'claude-opus-5-thinking-high', hint: 'Verdikt GO|NO-GO + sync gate na produkční issue' },
                'gate/go': { role: 'Další fáze', model: '—', hint: 'GO — spusť další produkční roli dle typu verdiktu' },
                'gate/no-go': { role: 'Předchozí role', model: '—', hint: 'NO-GO — oprav produkční issue, znovu review' },
              },
              'multiagent/implementace': {
                'gate/pending': { role: 'Vývojář', model: 'composer-2.5-fast', hint: 'Implementuj dle ANALÝZY; WIP commit OK' },
                'gate/no-go': { role: 'Vývojář (rework)', model: 'composer-2.5-fast', hint: 'Oprav dle VERDIKT-V' },
                'gate/go': { role: 'Tester', model: 'composer-2.5-fast', hint: 'Implementace schválena — spusť Testera' },
              },
              'multiagent/testy': {
                'gate/pending': { role: 'Tester', model: 'composer-2.5-fast', hint: 'Testy + checklist → Kontrolor T' },
                'gate/no-go': { role: 'Tester (rework)', model: 'composer-2.5-fast', hint: 'Oprav testy dle VERDIKT-T' },
                'gate/go': { role: 'Integrátor', model: 'composer-2.5-fast', hint: 'Testy OK — Integrátor uzavře pipeline' },
              },
            };

            const artifactMap = map[artifact] || map['multiagent/pipeline'];
            const info = artifactMap[gate] || artifactMap['gate/pending'] || { role: '—', model: '—', hint: 'Zkontroluj labely' };

            const prompt = pipelineNum ? `/m #${pipelineNum}` : `/m #${n}`;
            const commentBody = [
              `### Multiagent — další krok`,
              ``,
              `Artefakt: \`${artifact}\` · Gate: \`${gate}\` · Role: **${info.role}** · Model: \`${info.model}\``,
              ``,
              `V Cursoru (Agent chat):`,
              ``,
              '```text',
              prompt,
              '```',
              ``,
              `_(skill: \`.cursor/skills/m/SKILL.md\`)_`,
              ``,
              `_${info.hint}_`,
              ``,
              `Docs: \`docs/multi-agent-workflow.md\``,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 10,
            });
            const last = comments.length ? comments[comments.length - 1].body : '';
            if (last && last.includes(prompt) && last.includes(artifact) && last.includes(gate)) {
              core.info('Skip duplicate next-step comment');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body: commentBody,
            });
