name: Multi-agent pipeline sync

# Udržuje auto-přehled mezi markery v [PIPELINE] body.
# Bot mění jen <!-- multiagent:prehled:start --> … <!-- multiagent:prehled:end -->.
# Logika: docs/scripts/pipeline-sync-lib.cjs (unit test: test-pipeline-sync.sh)

on:
  issues:
    types: [opened, labeled, unlabeled, closed, reopened, edited]

permissions:
  issues: write
  contents: read

jobs:
  sync-prehled:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      !(github.event.action == 'edited' && github.actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync pipeline overview section
        uses: actions/github-script@v7
        with:
          script: |
            const sync = require('./docs/scripts/pipeline-sync-lib.cjs');
            const nextLib = require('./docs/scripts/multiagent-next-lib.cjs');
            const { START, END, PIPELINE_RE, parsePipelineNum, replacePrehledSection,
              buildVerdictHistoryLine, countNoGoRounds, shouldBlockPipeline,
              safeUpdatePipelineBody } = sync;

            const PHASES = [
              { key: 'ANALÝZA', artifact: 'multiagent/analyza', verdict: null },
              { key: 'VERDIKT-A', artifact: 'multiagent/verdikt', verdict: 'A' },
              { key: 'IMPLEMENTACE', artifact: 'multiagent/implementace', verdict: null },
              { key: 'VERDIKT-V', artifact: 'multiagent/verdikt', verdict: 'V' },
              { key: 'TESTY', artifact: 'multiagent/testy', verdict: null },
              { key: 'VERDIKT-T', artifact: 'multiagent/verdikt', verdict: 'T' },
            ];

            function resolveGate(labelList) {
              const gates = labelList.filter(l => l.startsWith('gate/'));
              const precedence = ['gate/go', 'gate/no-go', 'gate/blocked', 'gate/pending'];
              for (const g of precedence) {
                if (gates.includes(g)) return g;
              }
              return 'gate/pending';
            }

            function verdictKind(t) {
              if (/\[VERDIKT-A\]|VERDIKT-A/i.test(t)) return 'A';
              if (/\[VERDIKT-V\]|VERDIKT-V/i.test(t)) return 'V';
              if (/\[VERDIKT-T\]|VERDIKT-T/i.test(t)) return 'T';
              return null;
            }

            function phaseForIssue(issue) {
              const labels = (issue.labels || []).map(l => l.name);
              const title = issue.title || '';
              const vk = verdictKind(title);
              for (const phase of PHASES) {
                if (phase.verdict) {
                  if (labels.includes('multiagent/verdikt') && vk === phase.verdict) return phase.key;
                } else if (labels.includes(phase.artifact)) {
                  return phase.key;
                }
              }
              return null;
            }

            function issueGate(issue) {
              return resolveGate((issue.labels || []).map(l => l.name));
            }

            function issueState(issue) {
              return issue.state === 'closed' ? 'closed' : 'open';
            }

            const trigger = context.payload.issue;
            const triggerLabels = (trigger.labels || []).map(l => l.name);

            let pipelineNum = null;
            if (triggerLabels.includes('multiagent/pipeline')) {
              pipelineNum = String(trigger.number);
            } else {
              pipelineNum = parsePipelineNum(trigger.body || '');
            }

            if (!pipelineNum) {
              core.info('No pipeline number — skip sync');
              return;
            }

            const { data: pipelineIssue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parseInt(pipelineNum, 10),
            });

            const plLabels = (pipelineIssue.labels || []).map(l => l.name);
            if (!plLabels.includes('multiagent/pipeline')) {
              core.info(`#${pipelineNum} is not a pipeline issue — skip`);
              return;
            }

            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'multiagent',
              state: 'all',
              per_page: 100,
            });

            const children = allIssues.filter(i => {
              if (i.number === parseInt(pipelineNum, 10)) return false;
              if (i.pull_request) return false;
              return parsePipelineNum(i.body || '') === pipelineNum;
            });

            const byPhase = {};
            for (const phase of PHASES) byPhase[phase.key] = [];

            for (const child of children) {
              const pk = phaseForIssue(child);
              if (pk) byPhase[pk].push(child);
            }

            for (const phase of PHASES) {
              byPhase[phase.key].sort((a, b) => a.number - b.number);
            }

            function latestIssue(phaseKey) {
              const list = byPhase[phaseKey] || [];
              return list.length ? list[list.length - 1] : null;
            }

            const tableRows = PHASES.map(phase => {
              const iss = latestIssue(phase.key);
              if (!iss) {
                return `| ${phase.key} | — | — | — |`;
              }
              const gate = issueGate(iss);
              const state = issueState(iss);
              return `| ${phase.key} | #${iss.number} | \`${gate}\` | ${state} |`;
            });

            const historyParts = [];
            for (const phase of PHASES.filter(p => p.verdict)) {
              const line = buildVerdictHistoryLine(phase.key, byPhase[phase.key] || []);
              if (line) historyParts.push(line);
            }

            const historyLine = historyParts.length
              ? `Historie verdiktů: ${historyParts.join('; ')}`
              : 'Historie verdiktů: —';

            let nextRole = 'Integrátor → Analytik';
            let nextModel = nextLib.MODELS.integrator;
            let nextHint = `/m #${pipelineNum}`;

            outer: for (const phase of PHASES) {
              const iss = latestIssue(phase.key);
              if (!iss) {
                if (phase.key === 'ANALÝZA') {
                  nextRole = 'Analytik';
                } else if (phase.key.startsWith('VERDIKT')) {
                  nextRole = phase.key === 'VERDIKT-A' ? 'Kontrolor analytika'
                    : phase.key === 'VERDIKT-V' ? 'Kontrolor vývojáře'
                    : 'Kontrolor testera';
                } else if (phase.key === 'IMPLEMENTACE') {
                  nextRole = 'Vývojář';
                } else {
                  nextRole = 'Tester';
                }
                nextModel = nextLib.modelForPhase(phase.key);
                break outer;
              }
              const gate = issueGate(iss);
              if (gate === 'gate/no-go') {
                if (phase.key === 'ANALÝZA' || phase.key === 'VERDIKT-A') {
                  nextRole = 'Analytik (rework)';
                  nextModel = nextLib.MODELS.analytik;
                } else if (phase.key === 'IMPLEMENTACE' || phase.key === 'VERDIKT-V') {
                  nextRole = 'Vývojář (rework)';
                  nextModel = nextLib.MODELS.vyvojar;
                } else {
                  nextRole = 'Tester (rework)';
                  nextModel = nextLib.MODELS.tester;
                }
                break outer;
              }
              if (gate === 'gate/pending') {
                if (phase.key === 'ANALÝZA') {
                  nextRole = 'Analytik';
                } else if (phase.key === 'VERDIKT-A') {
                  nextRole = 'Kontrolor analytika';
                } else if (phase.key === 'IMPLEMENTACE') {
                  nextRole = 'Vývojář';
                } else if (phase.key === 'VERDIKT-V') {
                  nextRole = 'Kontrolor vývojáře';
                } else if (phase.key === 'TESTY') {
                  nextRole = 'Tester';
                } else {
                  nextRole = 'Kontrolor testera';
                }
                nextModel = nextLib.modelForPhase(phase.key);
                break outer;
              }
            }

            if (plLabels.includes('gate/blocked')) {
              nextRole = 'Eskalace';
              nextModel = '—';
              nextHint = 'Vyřeš gate/blocked (≥3 reworky)';
            } else if (shouldBlockPipeline(byPhase)) {
              nextRole = 'Eskalace';
              nextModel = '—';
              nextHint = '≥3 NO-GO verdikty — gate/blocked';
            } else {
              const allGo = ['VERDIKT-A', 'VERDIKT-V', 'VERDIKT-T'].every(k => {
                const iss = latestIssue(k);
                return iss && issueGate(iss) === 'gate/go';
              });
              if (allGo && plLabels.includes('gate/go')) {
                nextRole = 'Integrátor';
                nextModel = nextLib.MODELS.integrator;
                nextHint = 'Pipeline dokončena — uzavři issue';
              }
            }

            const sectionBlock = [
              START,
              '',
              '| Fáze | Issue | Gate | Stav |',
              '|------|-------|------|------|',
              ...tableRows,
              '',
              historyLine,
              '',
              `Další krok: **${nextRole}** · \`${nextModel}\` · ${nextHint}`,
              '',
              END,
            ].join('\n');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = parseInt(pipelineNum, 10);

            const currentBody = pipelineIssue.body || '';
            const preview = replacePrehledSection(currentBody, sectionBlock);
            if (preview === currentBody) {
              core.info('Pipeline prehled unchanged — skip edit');
            } else {
              const result = await safeUpdatePipelineBody(github, owner, repo, issueNumber, sectionBlock);
              core.info(`Pipeline prehled update: ${JSON.stringify(result)}`);
            }

            if (shouldBlockPipeline(byPhase) && !plLabels.includes('gate/blocked')) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['gate/blocked'],
              });
              core.info('Added gate/blocked — ≥3 NO-GO verdikt issues (body audit)');
            }
