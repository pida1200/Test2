name: Multi-agent IMPLEMENTACE
description: Výstup Vývojáře (vstup pro Kontrolora vývojáře)
title: "[IMPLEMENTACE] "
labels: ["multiagent", "multiagent/implementace", "gate/pending"]
body:
  - type: textarea
    id: ci_pipeline
    attributes:
      label: "CI řádek Pipeline (neměň formát)"
      description: "Samostatný řádek pro anchored regex v CI — doplň číslo za #"
      value: |
        Pipeline: #
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "Režim"
      description: "/m = plná 3+3; /m 2 = rychlá 2er (bez Analytika/Testera)"
      options:
        - "/m"
        - "/m 2"
    validations:
      required: true
  - type: input
    id: pipeline
    attributes:
      label: Pipeline issue # (kopie)
      placeholder: "#9"
    validations:
      required: true
  - type: input
    id: analyza
    attributes:
      label: ANALÝZA issue # (gate/go)
      description: Nepovinné v režimu /m 2
      placeholder: "#8"
    validations:
      required: false
  - type: input
    id: verdikt_a
    attributes:
      label: VERDIKT-A issue # (gate/go)
      description: Nepovinné v režimu /m 2
      placeholder: "#10"
    validations:
      required: false
  - type: textarea
    id: summary
    attributes:
      label: Shrnutí změn
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Seznam souborů
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Odchylky od ANALÝZY
      value: "Žádné"
  - type: textarea
    id: verify
    attributes:
      label: Ověření (příkazy + výsledek)
    validations:
      required: true
  - type: input
    id: wiki
    attributes:
      label: Wiki stránka
      description: "Volitelně — slug v docs/wiki/ bez .md, např. zmeny-2026-08-05-slug"
      placeholder: zmeny-2026-08-05-slug
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Verze artefaktu
      value: "v1"
