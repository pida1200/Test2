name: Multi-agent VERDIKT
description: Výstup kontrolora (GO/NO-GO) — použij pro VERDIKT-A/V/T
title: "[VERDIKT-] "
labels: ["multiagent", "multiagent/verdikt", "gate/pending"]
body:
  - type: textarea
    id: ci_contract
    attributes:
      label: "CI kontrakt (neměň formát řádků)"
      description: "Gate-check vyžaduje tyto samostatné řádky — doplň čísla a GO|NO-GO"
      value: |
        Verdikt: GO
        Pipeline: #
        Vstup: #
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Typ verdiktu
      options:
        - VERDIKT-A (analýza)
        - VERDIKT-V (vývoj)
        - VERDIKT-T (testy)
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdikt (sync s CI řádkem)
      options:
        - GO
        - NO-GO
    validations:
      required: true
  - type: input
    id: pipeline
    attributes:
      label: Pipeline issue # (kopie)
      placeholder: "#9"
    validations:
      required: true
  - type: input
    id: input_issue
    attributes:
      label: Vstupní produkční issue # (kopie)
      description: ANALÝZA / IMPLEMENTACE / TESTY
      placeholder: "#8"
    validations:
      required: true
  - type: input
    id: rework_round
    attributes:
      label: Rework kolo (1–3)
      description: Po 3. NO-GO nastav gate/blocked na pipeline
      value: "1"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Proč OK / seznam vad
      description: "Při NO-GO číslovaný seznam; při GO 2–4 body. U ESKALACE_VÝVOJÁŘ odkaz na [IMPLEMENTACE]. U odloženého nálezu odkaz na [BUG]."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Titulek:** uprav na `[VERDIKT-A|V|T] <feature> — GO|NO-GO`.

        **Labely (povinné):** nastav `gate/go` nebo `gate/no-go` na **tomto verdiktu i na produkčním issue**.

        **CI kontrakt** nahoře musí obsahovat samostatné řádky `Verdikt:` / `Pipeline:` / `Vstup:`.
