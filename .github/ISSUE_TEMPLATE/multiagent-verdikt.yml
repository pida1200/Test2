name: Multi-agent VERDIKT
description: Výstup kontrolora (GO/NO-GO) — použij pro VERDIKT-A/V/T
title: "[VERDIKT-] "
labels: ["multiagent", "multiagent/verdikt", "gate/pending"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Typ verdiktu
      options:
        - VERDIKT-A (analýza)
        - VERDIKT-V (vývoj)
        - VERDIKT-T (testy)
    validations:
      required: true
  - type: dropdown
    id: verdict
    attributes:
      label: Verdikt
      options:
        - GO
        - NO-GO
    validations:
      required: true
  - type: input
    id: pipeline
    attributes:
      label: Pipeline issue #
      description: "Jen číslo (#N); do body doplň samostatný řádek `Pipeline: #N`"
      placeholder: "#9"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Povinný řádek v body** (samostatně): `Pipeline: #<číslo z pole výše>`
  - type: input
    id: input_issue
    attributes:
      label: Vstupní produkční issue #
      description: ANALÝZA / IMPLEMENTACE / TESTY
      placeholder: "#8"
    validations:
      required: true
  - type: input
    id: rework_round
    attributes:
      label: Rework kolo (1–3)
      description: Po 3. NO-GO nastav gate/blocked na pipeline
      value: "1"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Proč OK / seznam vad
      description: "Při NO-GO číslovaný seznam; při GO 2–4 body. U ESKALACE_VÝVOJÁŘ odkaz na [IMPLEMENTACE]. U odloženého nálezu odkaz na [BUG]."
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Titulek:** uprav na `[VERDIKT-A|V|T] <feature> — GO|NO-GO`.

        **Labely (povinné):** nastav `gate/go` nebo `gate/no-go` na **tomto verdiktu i na produkčním issue** (# výše).

        **Body** musí začínat řádkem `Verdikt: GO` nebo `Verdikt: NO-GO`.
