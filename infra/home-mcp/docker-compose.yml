# home-mcp na stejném hostu jako mujdum (192.168.1.123).
# network_mode: host — MUJDUM_API_URL=http://127.0.0.1:3001
#
# Cursor: http://192.168.1.123:8766/mcp
# Authorization: Bearer <HOME_MCP_AUTH_TOKEN>

services:
  home-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-mcp
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
