name: Multi-agent TESTY
description: Výstup Testera (vstup pro Kontrolora testera)
title: "[TESTY] "
labels: ["multiagent", "multiagent/testy", "gate/pending"]
body:
  - type: input
    id: pipeline
    attributes:
      label: Pipeline issue #
      description: "Jen číslo (#N); do body doplň samostatný řádek `Pipeline: #N`"
      placeholder: "#9"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **Povinný řádek v body** (samostatně): `Pipeline: #<číslo z pole výše>`
  - type: input
    id: analyza
    attributes:
      label: ANALÝZA issue #
    validations:
      required: true
  - type: input
    id: implementace
    attributes:
      label: IMPLEMENTACE issue # (gate/go)
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Checklist scénářů (mapované na DoD)
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Soubory testů
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Příkazy + výsledky
    validations:
      required: true
  - type: textarea
    id: problems
    attributes:
      label: Nalezené problémy
      description: "Vada produktu ve scope → ESKALACE_VÝVOJÁŘ + odkaz na #IMPLEMENTACE. Mimo scope → založ [BUG] issue (šablona multiagent-bug)"
      value: "Žádné"
  - type: textarea
    id: bugs
    attributes:
      label: Založené bug issues
      description: Odkazy na [BUG] issues (#N), pokud vznikly mimo scope nebo jako odložené vady
      value: "Žádné"
  - type: input
    id: version
    attributes:
      label: Verze artefaktu
      value: "v1"
