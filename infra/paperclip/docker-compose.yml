# Paperclip + PostgreSQL 17 — viz https://github.com/paperclipai/paperclip/blob/master/doc/DOCKER.md
#
# Server image: oficiální GHCR image + Gemini CLI (`infra/paperclip/Dockerfile`).
# Lokální klon ./vendor/paperclip už build nepotřebuje (setup.sh ho pořád stáhne kvůli vývoji / odkazu).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      # Host 5433 aby nekolidoval s lokálním Postgres na 5432
      - "${POSTGRES_PUBLISH_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PAPERCLIP_IMAGE: ghcr.io/paperclipai/paperclip:latest
    ports:
      - "${PAPERCLIP_PORT:-3100}:3100"
    env_file:
      - paperclip.env
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      # Gemini CLI od určité verze vyžaduje „trusted workspace“ — bez toho selže hello probe v kontejneru /headless.
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    volumes:
      # Svazek musí být zapisovatelný pro uživatele `node` v kontejneru (Paperclip + Gemini pod HOME=/paperclip).
      # Po ručním `docker compose exec` jako root + gemini může být potřeba:
      #   docker compose exec -u root server chown -R node:node /paperclip
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
