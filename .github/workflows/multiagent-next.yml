name: Multi-agent next step

# Při změně multiagent/* nebo gate/* labelu napíše do issue komentář s /m #N.
# Logika: docs/scripts/multiagent-next-lib.cjs
#
# risk/low (#102 v2, Pipeline #100): u [ANALÝZA] dohledá nadřazenou [PIPELINE] a předá
# routeNextStep({ riskLow }) — přeskočí nejednoznačný hint "Kontrolor A / Vývojář".

on:
  issues:
    types: [labeled, unlabeled, opened]

permissions:
  issues: write
  contents: read

jobs:
  comment-next:
    if: >
      github.actor != 'github-actions[bot]' &&
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      (
        github.event.action == 'opened' ||
        startsWith(github.event.label.name, 'multiagent/') ||
        startsWith(github.event.label.name, 'gate/')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose next-step comment
        uses: actions/github-script@v7
        with:
          script: |
            const next = require('./docs/scripts/multiagent-next-lib.cjs');
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const body = issue.body || '';

            let riskLow = false;
            if (labels.includes('multiagent/analyza')) {
              const pipelineNum = next.parsePipelineNum(body);
              if (pipelineNum) {
                try {
                  const { data: pipelineIssue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: parseInt(pipelineNum, 10),
                  });
                  riskLow = (pipelineIssue.labels || []).map(l => l.name).includes('risk/low');
                } catch (e) {
                  riskLow = false; // fail-closed — bez ověření [PIPELINE] žádná zkratka
                }
              }
            }

            const { commentBody, marker } = next.routeNextStep({
              labels,
              title: issue.title || '',
              body,
              issueNumber: issue.number,
              riskLow,
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              if (existing.body === commentBody) {
                core.info('Skip unchanged next-step comment');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: commentBody,
            });
