name: Multi-agent gate check

# Validace verdikt issues — komentář při chybě (nefailuje celou pipeline).

on:
  issues:
    types: [labeled, opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate-gate:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent/verdikt')
    runs-on: ubuntu-latest
    steps:
      - name: Validate verdict issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const body = issue.body || '';
            const errors = [];

            // Body must start with Verdikt: GO|NO-GO
            if (!/^Verdikt:\s*(GO|NO-GO)/im.test(body)) {
              errors.push('Body musí začínat `Verdikt: GO` nebo `Verdikt: NO-GO`.');
            }

            // Exactly one of gate/go or gate/no-go
            const hasGo = labels.includes('gate/go');
            const hasNoGo = labels.includes('gate/no-go');
            if (hasGo && hasNoGo) {
              errors.push('Issue má současně `gate/go` i `gate/no-go` — ponechej jen jeden.');
            } else if (!hasGo && !hasNoGo) {
              errors.push('Chybí label `gate/go` nebo `gate/no-go`.');
            }

            // Verdict in body must match gate label
            const bodyGo = /^Verdikt:\s*GO/im.test(body);
            const bodyNoGo = /^Verdikt:\s*NO-GO/im.test(body);
            if (hasGo && bodyNoGo) {
              errors.push('Label `gate/go`, ale body říká NO-GO.');
            }
            if (hasNoGo && bodyGo) {
              errors.push('Label `gate/no-go`, ale body říká GO.');
            }

            // Pipeline reference
            const pipelineMatch = body.match(/(?:Pipeline(?:\s+issue)?(?:\s+#)?:?\s*)#?(\d+)/i);
            const inputMatch = body.match(/(?:Vstup(?:ní)?(?:\s+issue)?(?:\s+#)?:?\s*)#?(\d+)/i);

            if (!pipelineMatch) {
              errors.push('Body neobsahuje odkaz na pipeline (`Pipeline: #N`).');
            }

            if (!inputMatch) {
              errors.push('Body neobsahuje odkaz na produkční issue (`Vstup: #N`).');
            }

            // Check referenced issues exist (best-effort)
            async function issueExists(num) {
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(num, 10),
                });
                return true;
              } catch {
                return false;
              }
            }

            if (pipelineMatch) {
              const ok = await issueExists(pipelineMatch[1]);
              if (!ok) errors.push(`Pipeline issue #${pipelineMatch[1]} neexistuje.`);
            }

            if (inputMatch) {
              const ok = await issueExists(inputMatch[1]);
              if (!ok) errors.push(`Produkční issue #${inputMatch[1]} neexistuje.`);
            }

            if (errors.length === 0) {
              core.info('Gate check passed');
              return;
            }

            const marker = '<!-- multiagent-gate-check -->';
            const commentBody = [
              marker,
              `### ⚠️ Gate check — nalezeny problémy`,
              '',
              ...errors.map(e => `- ${e}`),
              '',
              'Oprav body/labely dle `docs/multi-agent-workflow.md` (sekce Gate).',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 20,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody,
              });
            }
