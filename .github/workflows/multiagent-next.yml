name: Multi-agent next step

# Při změně multiagent/* nebo gate/* labelu napíše do issue komentář s /m #N.
# Gate: deterministická precedence go > no-go > blocked > pending (vždy z aktuálních labelů).
# Dedupe: marker <!-- multiagent-next --> + updateComment (ne jen poslední komentář).

on:
  issues:
    types: [labeled, unlabeled, opened]

permissions:
  issues: write
  contents: read

jobs:
  comment-next:
    if: >
      github.actor != 'github-actions[bot]' &&
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      (
        github.event.action == 'opened' ||
        startsWith(github.event.label.name, 'multiagent/') ||
        startsWith(github.event.label.name, 'gate/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Compose next-step comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const title = issue.title || '';
            const n = issue.number;
            const body = issue.body || '';

            const PIPELINE_RE = /^\s*Pipeline(?:\s+issue)?:\s*#?(\d+)\s*$/m;

            // Deterministic gate: go > no-go > blocked > pending
            function resolveGate(labelList) {
              const gates = labelList.filter(l => l.startsWith('gate/'));
              const precedence = ['gate/go', 'gate/no-go', 'gate/blocked', 'gate/pending'];
              for (const g of precedence) {
                if (gates.includes(g)) return g;
              }
              return 'gate/pending';
            }

            function resolveArtifact(labelList) {
              const arts = labelList.filter(l => l.startsWith('multiagent/'));
              const order = [
                'multiagent/verdikt',
                'multiagent/analyza',
                'multiagent/implementace',
                'multiagent/testy',
                'multiagent/pipeline',
              ];
              for (const a of order) {
                if (arts.includes(a)) return a;
              }
              return arts[0] || 'multiagent/pipeline';
            }

            function verdictKind(t) {
              if (/\[VERDIKT-A\]|VERDIKT-A/i.test(t)) return 'A';
              if (/\[VERDIKT-V\]|VERDIKT-V/i.test(t)) return 'V';
              if (/\[VERDIKT-T\]|VERDIKT-T/i.test(t)) return 'T';
              return null;
            }

            const artifact = resolveArtifact(labels);
            const gate = resolveGate(labels);
            const vk = artifact === 'multiagent/verdikt' ? verdictKind(title) : null;

            const pipelineMatch = body.match(PIPELINE_RE);
            const pipelineNum = pipelineMatch
              ? pipelineMatch[1]
              : (artifact === 'multiagent/pipeline' ? String(n) : null);

            const verdictRoutes = {
              A: {
                'gate/pending': { role: 'Kontrolor analytika', model: 'claude-opus-5-thinking-high', hint: 'Verdikt GO|NO-GO + sync gate na #ANALÝZA' },
                'gate/go': { role: 'Vývojář', model: 'composer-2.5-fast', hint: 'VERDIKT-A GO — spusť Vývojáře → [IMPLEMENTACE]' },
                'gate/no-go': { role: 'Analytik (rework)', model: 'claude-opus-5-thinking-high', hint: 'VERDIKT-A NO-GO — oprav [ANALÝZA], znovu review' },
              },
              V: {
                'gate/pending': { role: 'Kontrolor vývojáře', model: 'gpt-5.6-sol-medium', hint: 'Verdikt GO|NO-GO + sync gate na #IMPLEMENTACE' },
                'gate/go': { role: 'Tester', model: 'composer-2.5-fast', hint: 'VERDIKT-V GO — spusť Testera → [TESTY]' },
                'gate/no-go': { role: 'Vývojář (rework)', model: 'composer-2.5-fast', hint: 'VERDIKT-V NO-GO — oprav [IMPLEMENTACE], znovu review' },
              },
              T: {
                'gate/pending': { role: 'Kontrolor testera', model: 'claude-sonnet-5-thinking-high', hint: 'Verdikt GO|NO-GO + sync gate na #TESTY' },
                'gate/go': { role: 'Integrátor', model: 'composer-2.5-fast', hint: 'VERDIKT-T GO — Integrátor uzavře [PIPELINE]' },
                'gate/no-go': { role: 'Tester (rework)', model: 'composer-2.5-fast', hint: 'VERDIKT-T NO-GO — oprav [TESTY] nebo eskalace na Vývojáře' },
              },
            };

            const map = {
              'multiagent/pipeline': {
                'gate/pending': { role: 'Integrátor → Analytik', model: 'composer-2.5-fast', hint: 'Kickoff: vytvoř [ANALÝZA] nebo spusť Analytika' },
                'gate/blocked': { role: 'Eskalace', model: '—', hint: 'Vyřeš blokaci (≥3 reworky), sundat gate/blocked' },
                'gate/go': { role: 'Integrátor', model: 'composer-2.5-fast', hint: 'Pipeline dokončena — uzavři issue' },
              },
              'multiagent/analyza': {
                'gate/pending': { role: 'Analytik', model: 'claude-opus-5-thinking-high', hint: 'Doplň analýzu → Kontrolor A' },
                'gate/no-go': { role: 'Analytik (rework)', model: 'claude-opus-5-thinking-high', hint: 'Oprav dle VERDIKT-A' },
                'gate/go': { role: 'Kontrolor A / Vývojář', model: 'claude-opus-5-thinking-high', hint: 'Analýza schválena — čeká VERDIKT-A nebo Vývojář' },
              },
              'multiagent/implementace': {
                'gate/pending': { role: 'Vývojář', model: 'composer-2.5-fast', hint: 'Implementuj dle ANALÝZY; WIP commit OK' },
                'gate/no-go': { role: 'Vývojář (rework)', model: 'composer-2.5-fast', hint: 'Oprav dle VERDIKT-V' },
                'gate/go': { role: 'Kontrolor V / Tester', model: 'gpt-5.6-sol-medium', hint: 'Implementace schválena — čeká VERDIKT-V nebo Tester' },
              },
              'multiagent/testy': {
                'gate/pending': { role: 'Tester', model: 'composer-2.5-fast', hint: 'Testy + checklist → Kontrolor T' },
                'gate/no-go': { role: 'Tester (rework)', model: 'composer-2.5-fast', hint: 'Oprav testy dle VERDIKT-T' },
                'gate/go': { role: 'Integrátor', model: 'composer-2.5-fast', hint: 'Testy OK — Integrátor uzavře pipeline' },
              },
            };

            let info;
            if (artifact === 'multiagent/verdikt' && vk && verdictRoutes[vk]) {
              info = verdictRoutes[vk][gate] || verdictRoutes[vk]['gate/pending'];
            } else {
              const artifactMap = map[artifact] || map['multiagent/pipeline'];
              info = artifactMap[gate] || artifactMap['gate/pending'] || { role: '—', model: '—', hint: 'Zkontroluj labely' };
            }

            const prompt = pipelineNum ? `/m #${pipelineNum}` : `/m #${n}`;
            const verdictTag = vk ? ` · Verdikt: **${vk}**` : '';
            const marker = '<!-- multiagent-next -->';
            const commentBody = [
              marker,
              `### Multiagent — další krok`,
              ``,
              `Artefakt: \`${artifact}\` · Gate: \`${gate}\`${verdictTag} · Role: **${info.role}** · Model: \`${info.model}\``,
              ``,
              `V Cursoru (Agent chat):`,
              ``,
              '```text',
              prompt,
              '```',
              ``,
              `_(skill: \`.cursor/skills/m/SKILL.md\`)_`,
              ``,
              `_${info.hint}_`,
              ``,
              `Docs: \`docs/multi-agent-workflow.md\``,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              if (existing.body === commentBody) {
                core.info('Skip unchanged next-step comment');
                return;
              }
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body: commentBody,
            });
