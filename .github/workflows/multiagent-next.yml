name: Multi-agent next step

# Při změně fáze (ma/*) napíše do issue komentář s jedním promptem do Cursoru.

on:
  issues:
    types: [labeled, opened]

permissions:
  issues: write
  contents: read

jobs:
  comment-next:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      (
        github.event.action == 'opened' ||
        startsWith(github.event.label.name, 'ma/')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Compose next-step comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const phase = labels.find(n => n.startsWith('ma/')) || 'ma/analyza';
            const n = issue.number;

            const map = {
              'ma/analyza': { role: 'Analytik', model: 'claude-opus-4-8-thinking-high', hint: 'Doplň sekci Analýza, pak label ma/review-a' },
              'ma/review-a': { role: 'Kontrolor analytika', model: 'claude-opus-4-8-thinking-high', hint: 'GO → ma/vyvoj, NO-GO → ma/analyza + vady' },
              'ma/vyvoj': { role: 'Vývojář', model: 'composer-2.5', hint: 'Implementuj dle Analýzy, sekce Implementace → ma/review-v' },
              'ma/review-v': { role: 'Kontrolor vývojáře', model: 'gpt-5.6-sol-high', hint: 'GO → ma/testy, NO-GO → ma/vyvoj' },
              'ma/testy': { role: 'Tester', model: 'composer-2.5', hint: 'Testy + sekce Testy → ma/review-t' },
              'ma/review-t': { role: 'Kontrolor testera', model: 'gpt-5.5-high', hint: 'GO → ma/done, NO-GO → ma/testy nebo ma/vyvoj' },
              'ma/done': { role: 'Integrátor', model: 'composer-2.5', hint: 'Finální testy/lint, commit, learning-log, zavři issue' },
              'ma/blocked': { role: 'Eskalace', model: '—', hint: 'Vyřeš blokaci, vrať správný ma/* label' },
            };

            const info = map[phase] || map['ma/analyza'];
              const body = [
              `### Multiagent — další krok`,
              ``,
              `Fáze: \`${phase}\` · Role: **${info.role}** · Model: \`${info.model}\``,
              ``,
              `V Cursoru (Agent chat):`,
              ``,
              '```text',
              `/m ${n}`,
              '```',
              ``,
              `_(stejné jako \`Multiagent #${n}\`)_`,
              ``,
              `_${info.hint}_`,
              ``,
              `Docs: \`docs/multi-agent-workflow.md\``,
            ].join('\n');

            // Avoid duplicate identical comments in a row
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 10,
            });
            const last = comments.length ? comments[comments.length - 1].body : '';
            if (last && last.includes(`/m ${n}`) && last.includes(phase)) {
              core.info('Skip duplicate next-step comment');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              body,
            });
