name: Multi-agent gate check

# Validace verdikt issues — komentář při chybě (nefailuje celou pipeline).

on:
  issues:
    types: [labeled, opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  validate-gate:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent') &&
      contains(join(github.event.issue.labels.*.name, ','), 'multiagent/verdikt')
    runs-on: ubuntu-latest
    steps:
      - name: Validate verdict issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const body = issue.body || '';
            const title = issue.title || '';
            const errors = [];

            // Body must START with Verdikt: GO|NO-GO (no multiline — ^ is start of string only)
            if (!/^Verdikt:\s*(GO|NO-GO)/.test(body.trimStart())) {
              errors.push('Body musí začínat `Verdikt: GO` nebo `Verdikt: NO-GO` (první ne-whitespace řádek).');
            }

            const hasGo = labels.includes('gate/go');
            const hasNoGo = labels.includes('gate/no-go');
            if (hasGo && hasNoGo) {
              errors.push('Issue má současně `gate/go` i `gate/no-go` — ponechej jen jeden.');
            } else if (!hasGo && !hasNoGo) {
              errors.push('Chybí label `gate/go` nebo `gate/no-go`.');
            }

            const bodyTrimmed = body.trimStart();
            const bodyGo = /^Verdikt:\s*GO\b/.test(bodyTrimmed);
            const bodyNoGo = /^Verdikt:\s*NO-GO\b/.test(bodyTrimmed);
            if (hasGo && bodyNoGo) {
              errors.push('Label `gate/go`, ale body říká NO-GO.');
            }
            if (hasNoGo && bodyGo) {
              errors.push('Label `gate/no-go`, ale body říká GO.');
            }

            const pipelineMatch = body.match(/(?:Pipeline(?:\s+issue)?(?:\s+#)?:?\s*)#?(\d+)/i);
            const inputMatch = body.match(/(?:Vstup(?:ní)?(?:\s+issue)?(?:\s+#)?:?\s*)#?(\d+)/i);

            if (!pipelineMatch) {
              errors.push('Body neobsahuje odkaz na pipeline (`Pipeline: #N`).');
            }
            if (!inputMatch) {
              errors.push('Body neobsahuje odkaz na produkční issue (`Vstup: #N`).');
            }

            async function fetchIssue(num) {
              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(num, 10),
                });
                return data;
              } catch {
                return null;
              }
            }

            function expectedProdLabel(t) {
              if (/\[VERDIKT-A\]|VERDIKT-A/i.test(t)) return 'multiagent/analyza';
              if (/\[VERDIKT-V\]|VERDIKT-V/i.test(t)) return 'multiagent/implementace';
              if (/\[VERDIKT-T\]|VERDIKT-T/i.test(t)) return 'multiagent/testy';
              return null;
            }

            if (pipelineMatch) {
              const pipeline = await fetchIssue(pipelineMatch[1]);
              if (!pipeline) {
                errors.push(`Pipeline issue #${pipelineMatch[1]} neexistuje.`);
              } else {
                const pl = (pipeline.labels || []).map(l => l.name);
                if (!pl.includes('multiagent/pipeline')) {
                  errors.push(`Pipeline #${pipelineMatch[1]} nemá label \`multiagent/pipeline\`.`);
                }
              }
            }

            if (inputMatch) {
              const prod = await fetchIssue(inputMatch[1]);
              if (!prod) {
                errors.push(`Produkční issue #${inputMatch[1]} neexistuje.`);
              } else {
                const expected = expectedProdLabel(title);
                if (expected) {
                  const pl = (prod.labels || []).map(l => l.name);
                  if (!pl.includes(expected)) {
                    errors.push(`Produkční #${inputMatch[1]} nemá očekávaný label \`${expected}\`.`);
                  }
                }
              }
            }

            if (errors.length === 0) {
              core.info('Gate check passed');
              return;
            }

            const marker = '<!-- multiagent-gate-check -->';
            const commentBody = [
              marker,
              `### ⚠️ Gate check — nalezeny problémy`,
              '',
              ...errors.map(e => `- ${e}`),
              '',
              'Oprav body/labely dle `docs/multi-agent-workflow.md` (sekce Gate).',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              per_page: 20,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody,
              });
            }
