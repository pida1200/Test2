name: Multi-agent ANALÝZA
description: Výstup Analytika (vstup pro Kontrolora analytika)
title: "[ANALÝZA] "
labels: ["multiagent", "multiagent/analyza", "gate/pending"]
body:
  - type: textarea
    id: ci_pipeline
    attributes:
      label: "CI řádek Pipeline (neměň formát)"
      description: "Samostatný řádek pro anchored regex v CI — doplň číslo za #"
      value: |
        Pipeline: #
    validations:
      required: true
  - type: input
    id: pipeline
    attributes:
      label: Pipeline issue (kopie pro přehled)
      description: "Stejné číslo jako v CI řádku výše"
      placeholder: "#9"
    validations:
      required: true
  - type: input
    id: goal
    attributes:
      label: Cíl (1 věta)
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / mimo scope
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: API nebo UI kontrakt
      description: request/response, stavy, chyby/HTTP
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Kritéria hotovo (3–5)
    validations:
      required: true
  - type: textarea
    id: edges
    attributes:
      label: Edge cases + rizika
    validations:
      required: true
  - type: textarea
    id: verify
    attributes:
      label: Návrh ověření
      placeholder: testy / lint / docker
    validations:
      required: true
  - type: textarea
    id: impl_steps
    attributes:
      label: Doporučené implementační kroky
      description: Pořadí = doporučená posloupnost commitů pro Vývojáře
      placeholder: |
        1. soubor X — popis
        2. soubor Y — popis
    validations:
      required: true
  - type: input
    id: wiki
    attributes:
      label: Wiki stránka
      description: "Volitelně — slug v docs/wiki/ bez .md, např. zmeny-2026-08-05-slug"
      placeholder: zmeny-2026-08-05-slug
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Verze artefaktu
      value: "v1"
