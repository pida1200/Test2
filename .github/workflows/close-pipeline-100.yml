name: Close pipeline 100 (one-shot)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  issues: write
  contents: write
  actions: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const nums = [100, 102, 104, 105, 106, 107, 108, 109, 110, 111, 112];
            const body = [
              '## Uzavřeno po merge do `main`',
              '',
              'Merge commit: `22f9077` (feature/pipeline-100-ma-p2).',
              'Verdikty A#105 V#108 T#111 = GO.',
              '',
              'Cloud agent nemohl přidat `merge/approved` / uzavřít Issues (403);',
              'uzavření provedeno one-shot workflowem po explicitní žádosti.',
            ].join('\n');

            for (const n of nums) {
              try {
                await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
              } catch (e) {
                core.warning(`comment #${n}: ${e.message}`);
              }
              try {
                await github.rest.issues.update({
                  owner, repo, issue_number: n, state: 'closed', state_reason: 'completed',
                });
                core.info(`closed #${n}`);
              } catch (e) {
                core.warning(`close #${n}: ${e.message}`);
              }
            }

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: 100, labels: ['merge/done'],
              });
              core.info('labeled #100 merge/done');
            } catch (e) {
              core.warning(`label #100: ${e.message}`);
            }

      - name: Remove one-shot workflow
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete workflow file and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f .github/workflows/close-pipeline-100.yml ]; then
            git rm .github/workflows/close-pipeline-100.yml
            git commit -m "ci: remove one-shot close-pipeline-100 workflow"
            git push origin main
          fi
