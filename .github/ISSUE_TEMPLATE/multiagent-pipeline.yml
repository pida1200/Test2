name: Multi-agent PIPELINE
description: Epic issue pro multi-agent pipeline (Integrátor kickoff)
title: "[PIPELINE] "
labels: ["multiagent", "multiagent/pipeline", "gate/pending"]
body:
  - type: input
    id: feature
    attributes:
      label: Feature (1 věta)
      placeholder: Přidat endpoint POST /echo s validací
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext
      description: Cesty v repu, relevantní docs/rules
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Odkazy na child issues (ruční fallback)
      description: Bot doplňuje tabulku v sekci Auto-přehled; checklist lze vyplnit ručně do doby sync
      value: |
        - [ ] ANALÝZA: #
        - [ ] VERDIKT-A: #
        - [ ] IMPLEMENTACE: #
        - [ ] VERDIKT-V: #
        - [ ] TESTY: #
        - [ ] VERDIKT-T: #
  - type: textarea
    id: prehled
    attributes:
      label: Auto-přehled (bot)
      description: Sekci mezi markery udržuje workflow multiagent-pipeline-sync.yml — neupravovat ručně uvnitř markerů
      value: |
        <!-- multiagent:prehled:start -->
        _(generuje multiagent-pipeline-sync.yml)_
        <!-- multiagent:prehled:end -->
  - type: textarea
    id: done
    attributes:
      label: Kritéria hotovo (návrh)
      placeholder: |
        3–5 bodů
        - [ ] docs/wiki struktura + záznam zmeny-* (pokud mění chování)
  - type: textarea
    id: verify
    attributes:
      label: Ověření
      placeholder: npm test / lint / docker
